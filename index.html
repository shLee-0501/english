<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영어 1등급">
<meta name="theme-color" content="#0b0b14">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>영어 1등급 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: 릴스형 전체 화면 세로 피드. 위 탭+스토리, 가운데 카드 한 장(종류별 그라데이션 + 흰 수식판), 오른쪽 버튼 줄, 왼쪽 아래 출처 캡션, 하단 탭 5개. 일부러 어두운 화면 하나로 고정 */
:root{
  --bg:#0b0b14; --panel:#171726; --panel2:#20203a; --line:#2c2c46; --ink:#f4f3ff; --muted:#a6a5c4;
  --pink:#ff4f8b; --cyan:#2fe0d0; --violet:#8a63ff; --gold:#ffc53d; --mint:#3ddc97; --coral:#ff5d6c;
  --paper:#ffffff; --paper-ink:#15152b; --paper-muted:#5c5c7a; --grid:#e8e8f3; --axis:#7a7a99;
  --font-display:"Jua","Apple SD Gothic Neo",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* 위쪽: 탭 + 스토리 */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:8px 4px}
.top .l{font-family:var(--font-display);font-size:1.05rem}
.top .l b{color:var(--pink);font-weight:400}
.seg{display:flex;gap:16px}
.seg button{font-weight:700;font-size:.95rem;color:var(--muted);padding:6px 0;position:relative}
.seg button.on{color:var(--ink)}
.seg button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:2px;background:var(--ink)}
.top .r{justify-self:end;display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 7px;border-radius:99px;background:var(--panel2);font-weight:700;font-size:.8rem}
.chip svg{width:16px;height:16px;color:var(--gold)}
.stories{display:flex;gap:12px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:58px}
.st .ring{width:56px;height:56px;border-radius:50%;padding:2.5px;background:conic-gradient(from 210deg,var(--pink),var(--gold),var(--cyan),var(--violet),var(--pink))}
.st.seen .ring{background:var(--line)}
.st .in{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-family:var(--font-display);font-size:.88rem;line-height:1.05;color:var(--ink);text-align:center}
.st .in img{width:100%;height:100%;object-fit:cover}
.st span{font-size:.66rem;color:var(--muted);white-space:nowrap}
.prog{display:flex;gap:3px;padding-block:0 6px}
.prog i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--ink)}
.prog i.now{background:linear-gradient(90deg,var(--pink),var(--gold))}

/* 피드 */
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always}
.card{position:relative;height:100%;overflow:hidden;border-radius:22px 22px 0 0;user-select:none;-webkit-user-select:none}
.k-concept{background:linear-gradient(160deg,#21155e 0%,#4b33c2 55%,#8a63ff 100%)}
.k-graph{background:linear-gradient(160deg,#101d52 0%,#2a52cc 55%,#45a3ff 100%)}
.k-ex{background:linear-gradient(160deg,#05363c 0%,#0d827e 55%,#27caa9 100%)}
.k-quiz{background:linear-gradient(160deg,#3e0b33 0%,#a5216a 55%,#ff5f8f 100%)}
.k-deep{background:linear-gradient(160deg,#3d1904 0%,#b44c16 55%,#ff9f3a 100%)}
.k-char{background:linear-gradient(175deg,#1f74e0 0%,#7cc2ff 75%,#cbe8ff 100%)}
.k-end{background:linear-gradient(160deg,#25125a 0%,#7a2c9c 55%,#ff4f8b 100%)}
.card::after{content:"";position:absolute;inset:auto 0 0;height:120px;background:linear-gradient(transparent,rgba(5,5,15,.55));pointer-events:none;z-index:1}
.cbody{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:16px 74px 92px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.cbody::-webkit-scrollbar{display:none}
.card.more .cbody{-webkit-mask-image:linear-gradient(#000 calc(100% - 110px),transparent calc(100% - 70px));mask-image:linear-gradient(#000 calc(100% - 110px),transparent calc(100% - 70px))}
.moretag{display:none;position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:3;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(10,10,25,.75);color:#fff;pointer-events:none}
.card.more .moretag{display:block}
.kind{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.card h2{font-size:1.65em;line-height:1.2}
.q{font-size:1.08em;font-weight:600;line-height:1.55}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:14px 14px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.paper .lbl{font-size:.72rem;font-weight:700;color:var(--paper-muted);margin-bottom:6px}
.mf{display:block;width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;text-align:center;white-space:nowrap;font-size:1.3em;line-height:1.6}
.mf + .mf{margin-top:2px}
.mi{white-space:nowrap}
math{font-size:1.06em}
.fig svg{display:block;width:100%;height:auto;max-height:34vh}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figs .fcap{text-align:center;font-size:.8rem;font-weight:700;color:var(--paper-muted)}

/* 빈칸 */
.props{display:flex;flex-direction:column;gap:9px;font-size:.98em;font-weight:500}
.props li{list-style:none;display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:baseline}
.props ol{margin:0;padding:0}
.props .no{width:20px;height:20px;border-radius:50%;background:var(--paper-ink);color:var(--paper);font-size:.7rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transform:translateY(-1px)}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:58px;min-height:30px;padding:1px 10px;margin:0 2px;border-radius:10px;border:2px dashed #b8a8ff;background:#f1edff;color:#5b3fd6;font-weight:700;vertical-align:middle;transition:transform .15s}
.blank:active{transform:scale(.95)}
.blank.open{border-style:solid;border-color:#3ddc97;background:#e3faf0;color:#0b6e48;animation:flip .35s}
.cnt{font-size:.8rem;font-weight:700;opacity:.9}

/* 퀴즈 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;gap:10px;align-items:center;min-height:54px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.95);color:var(--paper-ink);font-weight:700;text-align:left;border:3px solid transparent;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:#ececf6;color:var(--paper-muted);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.opt .t{min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.opt.ox{justify-content:center;font-family:var(--font-display);font-size:2.4rem;min-height:84px;font-weight:400}
.opt.right{border-color:var(--mint);background:#e3faf0}.opt.right .n{background:var(--mint);color:#fff}
.opt.wrong{border-color:var(--coral);background:#ffe8ea;animation:shake .35s}.opt.wrong .n{background:var(--coral);color:#fff}
.opt:disabled{cursor:default}
.hint{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;font-size:.95em;backdrop-filter:blur(6px)}
.hint b{color:var(--gold)}
.hbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.2);font-weight:700;font-size:.9em}
.hbtn svg{width:18px;height:18px}
.react{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:end;animation:pop .35s}
.react img{width:70px;height:88px;object-fit:cover;object-position:50% 6%;border-radius:16px;background:rgba(255,255,255,.25)}
.bubble{display:inline-block;background:#fff;color:#15152b;padding:9px 13px;border-radius:16px 16px 16px 4px;font-weight:600;font-size:.92em;line-height:1.4}
.bubble small{display:block;color:var(--pink);font-weight:700;font-size:.72rem}
.whyb{display:flex;gap:6px;flex-wrap:wrap}
.whyb button{padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-weight:700;font-size:.85em}
.whyb button.on{background:#fff;color:#15152b}

/* 예제 */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;background:rgba(255,255,255,.95);color:var(--paper-ink);border-radius:14px;padding:9px 11px;animation:pop .3s}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#0d827e;color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.step div{min-width:0;padding-top:2px}
.step.ans i{background:var(--pink)}
.next{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:12px 18px;border-radius:99px;background:#fff;color:#15152b;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.18)}

/* 캐릭터 */
.k-char .cbody{padding:0}
.k-char .figure{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end}
.k-char .figure img{height:94%;width:auto;max-width:none;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.k-char .sayc{position:relative;z-index:2;margin:16px 74px 0 16px}
.k-char .bubble{font-size:1.05rem;box-shadow:0 10px 24px rgba(10,30,80,.25)}
.k-end .cbody{align-items:center;justify-content:center;text-align:center}
.k-end img{width:140px;height:176px;object-fit:cover;object-position:50% 8%;border-radius:22px;background:rgba(255,255,255,.2)}

/* 오른쪽 버튼 줄 */
.rail{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:84px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.rb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.rb .c{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22);backdrop-filter:blur(6px);transition:transform .15s}
.rb svg{width:26px;height:26px}
.rb:active .c{transform:scale(.88)}
.rb.on.like .c{color:var(--pink);background:#fff}
.rb.on.like svg,.rb.on.save svg{fill:currentColor}
.rb.on.save .c{color:var(--gold);background:#fff}
.burst{position:fixed;z-index:45;width:110px;height:110px;margin:-55px 0 0 -55px;color:var(--pink);pointer-events:none;animation:burst .75s ease-out forwards}
.burst svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 8px 18px rgba(255,79,139,.55))}

/* 캡션 */
.cap{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:76px;bottom:16px;z-index:2;display:flex;flex-direction:column;gap:3px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.cap .src{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.cap .src .av{width:28px;height:28px;border-radius:50%;background:#fff;color:#15152b;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:.8rem;flex:none}
.cap .tags{font-size:.82rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swipe{position:absolute;left:50%;bottom:110px;z-index:4;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.85rem;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.5);animation:nudge 1.6s ease-in-out 3,gone .4s 4.8s forwards}
.swipe svg{width:34px;height:34px}

/* 탐색 */
.scroll{flex:1;min-height:0;overflow-y:auto;padding-block:6px 22px}
.stack{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;align-items:baseline;justify-content:space-between}
.grp h2{font-size:1.3rem}
.grp span{font-size:.8rem;color:var(--muted)}
.reelgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{position:relative;aspect-ratio:9/13;max-width:100%;border-radius:12px;overflow:hidden;text-align:left;padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.tile .nb{font-family:var(--font-display);font-size:1.9rem;line-height:1;opacity:.95}
.tile .tt{font-size:.74rem;font-weight:700;line-height:1.3}
.tile .pb{height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:5px}
.tile .pb i{display:block;height:100%;background:#fff}
.tile .bd{position:absolute;top:7px;right:7px;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:99px;background:#fff;color:#15152b}
.g-exp{background:linear-gradient(160deg,#21155e,#8a63ff)}
.g-log{background:linear-gradient(160deg,#101d52,#45a3ff)}
.g-fn{background:linear-gradient(160deg,#3e0b33,#ff5f8f)}
.g-tri{background:linear-gradient(160deg,#05363c,#27caa9)}
.g-sum{background:linear-gradient(160deg,#3d1904,#ff9f3a)}
.tile.dim{opacity:.55}

/* 공통 패널 */
.panel{background:var(--panel);border-radius:22px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:99px;font-weight:700;background:var(--panel2)}
.btn.pink{background:var(--pink);color:#fff}
.btn.wide{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:.85rem}
.mode{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:20px;background:var(--panel)}
.mode .ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.mode .ic svg{width:26px;height:26px}
.mode small{display:block;color:var(--muted);font-size:.82rem}
.mode .tag{font-size:.7rem;font-weight:700;color:var(--muted);background:var(--panel2);padding:4px 9px;border-radius:99px}
.hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(170deg,#1f74e0,#7cc2ff);min-height:240px;display:flex;flex-direction:column;justify-content:flex-end}
.hero img{position:absolute;right:-4px;bottom:0;width:52%;height:100%;object-fit:cover;object-position:50% 8%;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%);mask-image:linear-gradient(to right,transparent 0,#000 30%)}
.hero .hi{position:absolute;left:14px;top:14px;right:46%;z-index:2}
.hero .info{position:relative;z-index:2;margin:0 10px 10px;padding:12px 14px;border-radius:18px;background:var(--panel)}
.grade{font-family:var(--font-display);font-size:2.4rem;line-height:.95;color:var(--cyan)}
.grade small{font-size:1rem;color:var(--ink)}
.xpbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.whybar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line)}
.whybar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--ink)}
.lab{font-weight:700;font-size:.88rem}
textarea.out{width:100%;min-height:110px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--ink)}

/* 하단 탭 */
nav{flex:none;position:relative;z-index:5;background:var(--bg);border-top:1px solid var(--line)}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:.68rem;font-weight:700;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink)}
nav .plus span{width:48px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#15152b;background:#fff;box-shadow:-3px 0 0 var(--cyan),3px 0 0 var(--pink)}

/* 시트, 스토리, 토스트 */
.sheetwrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
.sheet{width:100%;max-width:520px;background:var(--panel);border-radius:26px 26px 0 0;padding-block:12px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sv{position:fixed;inset:0;z-index:70;background:linear-gradient(175deg,#1f74e0,#7cc2ff 70%,#cfe9ff);color:#fff;display:flex;flex-direction:column;overflow:hidden;animation:fadein .2s;touch-action:none}
.sv.dark{background:linear-gradient(170deg,#21155e,#8a63ff)}
.sv .bars{display:flex;gap:4px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.sv .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sv .bars i b{display:block;height:100%;width:0;background:#fff}
.sv .bars i.done b{width:100%}
.sv .bars i.cur b{animation:fill linear forwards}
.sv .who{display:flex;align-items:center;gap:8px;padding-block:10px;font-weight:700;font-size:.9rem}
.sv .who img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.sv .who .x{margin-left:auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.sv .who .x svg{width:24px;height:24px}
.sv .stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.sv .fig2{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.sv .fig2 img{height:100%;width:auto;max-width:none;object-fit:contain;object-position:50% 100%;animation:enter .5s cubic-bezier(.2,.9,.3,1.2) both}

.sv .hintt{text-align:center;font-size:.75rem;opacity:.85;padding-block:10px 14px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#15152b;padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:700;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.float{position:fixed;z-index:46;font-family:var(--font-display);font-size:1.4rem;color:var(--gold);pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes enter{from{transform:translateY(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
@keyframes burst{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1) translateY(-30px);opacity:0}}
@keyframes gone{to{opacity:0;visibility:hidden}}
@keyframes nudge{0%,100%{transform:translate(-50%,0);opacity:.95}50%{transform:translate(-50%,-14px);opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sv .bars i.cur b{width:100%}}
/* ===== v3 추가 ===== */
.sheethead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:6px 8px}

.mini{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:99px;background:var(--panel2);font-size:.75rem;font-weight:700;white-space:nowrap}

.reveal{display:flex;flex-direction:column;gap:8px}

.mark{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.mark .no{background:#fff;color:var(--coral)}
.marked{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:6px 12px;border-radius:99px;font-weight:700;font-size:.85em}
.marked.r{background:var(--mint);color:#062b1c}.marked.w{background:#fff;color:var(--coral)}
.retry{align-self:flex-start;font-size:.8em;font-weight:700;text-decoration:underline;opacity:.9}
.opts.five .opt{min-height:46px;padding:8px 12px}
.timer{position:absolute;top:14px;right:max(14px,env(safe-area-inset-right,0px));z-index:3;display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.35);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.timer svg{width:16px;height:16px}
.k-photo{background:linear-gradient(160deg,#151530 0%,#2b2b55 60%,#4a4a8a 100%)}
.phimg{display:block;width:100%;max-height:44vh;object-fit:contain;border-radius:14px;background:#000}
.phtags{display:flex;gap:6px;flex-wrap:wrap}
.phtags span{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
.stage5{display:flex;gap:4px}
.stage5 i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
.stage5 i.on{background:var(--mint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:9px 14px;border-radius:99px;background:var(--panel2);font-weight:700;font-size:.88rem;border:2px solid transparent}
.chips button.on{background:#fff;color:#15152b}
.numgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.numgrid button{min-height:40px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.numgrid button.on{background:#fff;color:#15152b}
.numgrid button.cur{box-shadow:inset 0 0 0 2px var(--pink)}
.sheet.tall{max-height:92%;overflow-y:auto}
.tagprev{display:block;width:100%;max-height:28vh;object-fit:contain;border-radius:14px;background:#000}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:12px;overflow:hidden;background:var(--panel2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;left:4px;right:4px;bottom:4px;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:8px;background:rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb.grad{opacity:.5}
.thumb .due{position:absolute;top:4px;right:4px;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--pink);color:#fff}
.sendlist{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.lvl3{background:var(--gold)!important;color:#3d1904}
.groupbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.groupbtns button{text-align:left;padding:12px;border-radius:16px;background:var(--panel2);font-weight:700}
.groupbtns small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
/* 동경 돌리기 위젯 */
.angw{display:flex;flex-direction:column;gap:8px}
.angsvg{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;display:flex;justify-content:center}

.angbtns button{min-height:40px;border-radius:12px;background:#ececf6;color:var(--paper-ink);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}

.angrow{flex-wrap:wrap}

.angsvg svg{max-height:27vh}

select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
/* 개념 설명 · 읽어 주기 */
.exbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:99px;background:#fff;color:#4b33c2;font-weight:700;font-size:.9em;box-shadow:0 6px 0 rgba(0,0,0,.18)}

:root{--pn-bg:var(--pn-bg-app,#171726);--pn-panel:var(--pn-panel-app,#20203a);--pn-ink:var(--pn-ink-app,#f4f3ff);--pn-muted:var(--pn-muted-app,#a6a5c4);--pn-accent:var(--pn-accent-app,#ff4f8b);--pn-ok:#3ddc97;--pn-no:#ff5d6c}

.pn-sheet.tall{max-height:94%}
.pn-grab{width:40px;height:5px;border-radius:3px;background:var(--pn-panel);margin:0 auto}
.pn-h{margin:0;font-size:1.25rem}

.pn-empty{padding:18px 0;text-align:center}
.pn-warn{margin:0;color:var(--pn-no);font-weight:700;font-size:.9rem}
.pn-lab{font-weight:700;font-size:.88rem}
.pn-big{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border:0;border-radius:18px;background:var(--pn-panel);color:var(--pn-ink);font:inherit;cursor:pointer}
.pn-big .pn-ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.pn-big small{display:block;color:var(--pn-muted);font-size:.8rem}
.pn-btn,.pn-primary,.pn-ok,.pn-no,.pn-later,.pn-danger{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 14px;border:0;border-radius:16px;font:inherit;font-weight:700;cursor:pointer;text-align:center;background:var(--pn-panel);color:var(--pn-ink)}

.pn-no{background:#fff;color:var(--pn-no)}

.pn-danger{background:var(--pn-no);color:#fff}
.pn-link{border:0;background:none;color:var(--pn-accent);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.pn-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pn-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pn-imgbox{position:relative;border-radius:16px;overflow:hidden;background:#000}
.pn-imgbox img{display:block;width:100%;max-height:46vh;object-fit:contain}
.pn-imgbox.small img{max-height:24vh}
.pn-rot{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:1.2rem;cursor:pointer}
.pn-chips{display:flex;gap:6px;flex-wrap:wrap}
.pn-chips button,.pn-tabs button{padding:9px 13px;border:0;border-radius:99px;background:var(--pn-panel);color:var(--pn-ink);font:inherit;font-weight:700;font-size:.86rem;cursor:pointer}
.pn-chips button.on,.pn-tabs button.on{background:#fff;color:#15152b}
.pn-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pn-tabs b{font-variant-numeric:tabular-nums}
.pn-inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--pn-panel);background:var(--pn-panel);color:var(--pn-ink)}
.pn-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pn-thumb{position:relative;aspect-ratio:3/4;max-width:100%;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--pn-panel);cursor:pointer}

.pn-thumb span{position:absolute;left:4px;right:4px;bottom:4px;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pn-cardimg{display:block;width:100%;max-height:36vh;object-fit:contain;border-radius:14px;background:#000}
.pn-memo{margin:0;font-weight:600}

@keyframes pnrise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pn-sheet{animation:none}}

<body>
<div class="shell">
  <div class="main" id="app"></div>
  <nav aria-label="메뉴"><div class="in gut" id="tabs"></div></nav>
</div>
<div class="toast" id="toast" role="status"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="layer"></div>
<script>
const PhotoNote=(function(){
  let C=null,db=null,ITEMS=[];const URLS={},RS={};let Q=[],T=null,listTab="review",viewId=null,confirmDel=null;
  const GAPS=[1,3,7];
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const R=s=>C.render?C.render(s):esc(s);
  const today=()=>C.today(),addDays=(s,n)=>C.addDays(s,n);
  const url=(p,k="blob")=>{const key=p.id+k;if(!URLS[key]&&p[k])URLS[key]=URL.createObjectURL(p[k]);return URLS[key]||""};
  const drop=(p)=>{["blob","ans"].forEach(k=>{if(URLS[p.id+k]){URL.revokeObjectURL(URLS[p.id+k]);delete URLS[p.id+k]}})};
  const st=()=>{const s=C.store();s.pnOff=s.pnOff||{};return s};
  const why=k=>(C.reasons.find(r=>r[0]===k)||[,""])[1];
  const unitLabel=id=>{const u=C.units().find(x=>x.id===id);return u?(u.short||u.label):"단원 미정"};  /* 태그·파일 이름에는 짧은 이름(short) */
  /* --- 저장소 --- */
  function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(C.dbName,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("photos"))r.result.createObjectStore("photos",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
  const tx=m=>db.transaction("photos",m).objectStore("photos");
  const put=o=>new Promise((res,rej)=>{if(!db)return rej(new Error("사진 저장소를 열 수 없어요"));const r=tx("readwrite").put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  const del=id=>new Promise((res,rej)=>{if(!db)return rej();const r=tx("readwrite").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  /* 예전 구조(sheet, grad)에서 새 구조(unit, state)로 자동 이전 */
  function migrate(p){if(p.state)return false;p.unit=p.unit||p.sheet||null;p.state=p.grad?"grad":"review";p.stage=p.stage||0;p.due=p.due||today();delete p.sheet;delete p.grad;return true}
  async function load(){try{db=await idb();ITEMS=await new Promise((res,rej)=>{const r=tx("readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});for(const p of ITEMS)if(migrate(p))await put(p)}catch(e){ITEMS=[]}}
  /* --- 사진 줄이기·돌리기 (긴 변 1200px, JPEG 0.7) --- */
  async function shrink(file,rot=0){const u=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("이미지를 열 수 없어요"));i.src=u});
      const k=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k),sw=rot%180!==0,c=document.createElement("canvas");
      c.width=sw?h:w;c.height=sw?w:h;const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(img,-w/2,-h/2,w,h);
      return await new Promise(r=>c.toBlob(r,"image/jpeg",.7))}finally{URL.revokeObjectURL(u)}}
  const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  /* --- 겹쳐 띄우는 화면 --- */
  function layer(html,tall){let el=document.getElementById("pnLayer");if(!el){el=document.createElement("div");el.id="pnLayer";document.body.appendChild(el)}
    el.innerHTML=html?`<div class="pn-wrap" data-pn="close-bg"><div class="pn-sheet ${tall?"tall":""}" role="dialog" aria-modal="true"><div class="pn-grab"></div>${html}</div></div>`:""}
  const close=()=>{layer("");T=null;Q=[];viewId=null;confirmDel=null};
  function openCapture(){layer(`<h3 class="pn-h">오프라인 문제 채점</h3><p class="pn-muted">종이에 푼 문제를 찍고, 맞았는지 채점해요. 틀린 문제만 오답노트에 남아요.</p>
    <label class="pn-big" for="pnCam"><span class="pn-ic">📷</span><span><b>카메라로 찍기</b><small>한 문제씩 찍어요</small></span></label><input id="pnCam" type="file" accept="image/*" capture="environment" hidden>
    <label class="pn-big" for="pnAlbum"><span class="pn-ic">🖼️</span><span><b>앨범에서 여러 장 고르기</b><small>학원·학교에서 찍어 둔 사진을 한꺼번에</small></span></label><input id="pnAlbum" type="file" accept="image/*" multiple hidden>
    <button class="pn-big" data-pn="list"><span class="pn-ic">📒</span><span><b>오답노트 보기</b><small>${counts().inbox?`정리 대기 ${counts().inbox}장 · `:""}복습 중 ${counts().review}장 · 졸업 ${counts().grad}장</small></span></button>
    <button class="pn-btn" data-pn="close">닫기</button>`)}
  /* 채점 화면: 사진마다 맞음/틀림/나중에 */
  async function nextInQueue(){if(!Q.length){close();C.onChange();return}const f=Q.shift();C.toast&&C.toast("사진을 줄이는 중…");
    try{const blob=await shrink(f);T={blob,url:URL.createObjectURL(blob),rot:0,step:"grade",src:st().pnLastSrc||C.sources[0],unit:null,why:null,memo:"",ans:null,ansUrl:null};drawT()}
    catch(e){C.toast&&C.toast("이 사진은 열 수 없어요. 다음 사진으로 넘어갈게요");nextInQueue()}}
  function drawT(){const t=T,left=Q.length;
    if(t.step==="grade")return layer(`<div class="pn-row"><h3 class="pn-h">채점하기</h3><span class="pn-muted">${left?`남은 사진 ${left}장`:""}</span></div>
      <div class="pn-imgbox"><img src="${t.url}" alt="찍은 문제"><button class="pn-rot" data-pn="rot" aria-label="사진 돌리기">⟳</button></div>
      <p class="pn-muted">답지나 해설과 맞춰 보고 골라 줘.</p>

function fitCard(card){

}

function confetti(n){if(reduce)return;const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

/* ===== 읽어 주기: 영어는 en-US, 한국어는 ko-KR (가이드 3-4 english-say 방식) ===== */
let speakingId=null;const VOICE={};
function voiceFor(lang,who){try{const vs=speechSynthesis.getVoices();const k=lang+(who||"");if(VOICE[k]&&vs.includes(VOICE[k]))return VOICE[k];
  const L=vs.filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(lang.toLowerCase()));
  const F=/Samantha|Allison|Ava|Susan|Zira|Jenny|Female|Google US English/i,M=/Alex|Daniel|Fred|Tom|Aaron|David|Guy|Male/i;
  const v=(who==="M"?L.find(v=>M.test(v.name)):who==="W"?L.find(v=>F.test(v.name)):null)||L.find(v=>/Google|Samantha|Yuna|유나|Siri/i.test(v.name))||L[0]||null;return VOICE[k]=v}catch(e){return null}}
function enSay(t){return strip(t).replace(/_{2,}/g," blank ").replace(/\(\s*[①②③④⑤]\s*\)/g," ").replace(/[①②③④⑤]/g,"").replace(/\s\/\s/g,", ").replace(/\(([A-E])\)/g,"$1.").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\s+/g," ").trim()}
function langRuns(t){const out=[];let cur=null;
  for(const ch of String(t)){const k=/[가-힣ㄱ-ㅣ]/.test(ch)?"ko":/[A-Za-z]/.test(ch)?"en":null;
    if(k&&(!cur||cur.lang!==k)){cur={lang:k,text:""};out.push(cur)}if(cur)cur.text+=ch;else if(!out.length){cur={lang:"ko",text:ch};out.push(cur)}}
  return out.map(r=>({lang:r.lang==="en"?"en-US":"ko-KR",text:r.text.trim()})).filter(r=>/[가-힣A-Za-z0-9]/.test(r.text))}
function enSentences(t){return enSay(t).split(/(?<=[.?!"])\s+(?=[A-Z"'(])|\n+/).map(x=>x.trim()).filter(Boolean)}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}if(speakingId)document.querySelectorAll(`[data-speak="${CSS.escape(speakingId)}"]`).forEach(x=>x.classList.remove("speaking"));speakingId=null}
function queueSay(parts,id){if(S.tts==="off"||!parts.length)return;try{stopSpeak();
  if(id){speakingId=id;document.querySelectorAll(`[data-speak="${CSS.escape(id)}"]`).forEach(x=>x.classList.add("speaking"))}
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.text);u.lang=p.lang;u.rate=(S.ttsRate||1)*(p.lang==="en-US"?.95:1);const v=voiceFor(p.lang,p.who);if(v)u.voice=v;
    if(i===parts.length-1&&id)u.onend=u.onerror=()=>{if(speakingId===id)stopSpeak()};speechSynthesis.speak(u)})}catch(e){toast("이 기기에서는 읽어 주기를 쓸 수 없어요")}}
const speakKo=(t,id)=>queueSay([{lang:"ko-KR",text:strip(t)}],id);
const speakEn=(t,id)=>queueSay(enSentences(t).map(s=>({lang:"en-US",text:s})),id);
const speakMixed=(t,id)=>queueSay(langRuns(strip(t).replace(/[{}]/g,"").replace(/→/g,", ")),id);
function speakCard(c,id){if(!c)return;id=id||c.id;
  if(c.k==="word")return speakMixed(`${c.en}. ${c.ko}. ${c.ex} ${c.exKo}`,id);
  if(c.k==="passage")return speakEn([c.given,c.passage].filter(Boolean).join("\n"),id);
  if(c.k==="read")return speakSent(c,ui(c.id).si||0,id);
  if(c.k==="concept")return speakMixed(c.say||c.title,id);
  if(c.k==="play")return speakMixed(c.play.ko+" "+c.play.answer.map(i=>c.play.tiles[i]).join(" "),id);
  if(c.k==="essay")return speakKo(c.q,id);
  speakKo(c.title||c.q||"",id)}

function todayList(){
  if(!S.today||S.today.d!==today()){
    const ids=[],pickFrom=(L,start,n)=>{const out=[];let k=Math.max(0,L.findIndex(s=>s.no===start));for(;k<L.length&&out.length<n;k++)for(const c of (L[k].cards||[])){if(!isDone(c))out.push(c.id);if(out.length>=n)break}return out};
    dueWords().slice(0,6).forEach(c=>ids.push(c.id));
    pickFrom(TN,S.curN,S.daily).forEach(id=>ids.push(id));
    if(TS.some(ready)){const g=pickFrom(TS,S.curS,S.dailyS||4);const step=Math.max(2,Math.floor((ids.length+g.length)/(g.length+1)));g.forEach((id,i)=>ids.splice(Math.min(ids.length,(i+1)*step+i),0,id))}
    S.today={d:today(),ids:[...new Set(ids)]};save();
  }
  const list=S.today.ids.map(id=>BYID[id]).filter(Boolean);
  if(list.length>3)list.splice(Math.floor(list.length/2),0,CHAR);
  list.push(END);return list;
}

/* ===== 직접 해 보기: 끊어 읽기 (단어 사이를 눌러 / 넣기) =====

function ckSt(c){return PL[c.id]||(PL[c.id]={cut:new Set(),chk:false})}
function chunkHTML(c){const p=c.play,s=ckSt(c),st=S.cards[c.id]||{},need=new Set(p.need),ok=new Set(p.ok||[]);
  const wrong=[...s.cut].filter(g=>!need.has(g)&&!ok.has(g)),miss=p.need.filter(g=>!s.cut.has(g)),pass=s.chk&&!wrong.length&&!miss.length;

   ${s.chk&&!pass?`<div class="plmsg">${wrong.length?`빨간 / ${wrong.length}곳은 의미 덩어리 중간이에요. `:""}${miss.length?`점선 칸 ${miss.length}곳을 더 끊어야 해요.`:""}</div>`:""}

/* 직접 해 보기: 배열 영작 (조각을 눌러 순서대로 놓기) */
const PL={};
function shuf(n,seed){const a=[...Array(n).keys()];let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;for(let i=n-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}if(a.every((v,i)=>v===i))a.reverse();return a}
const plSt=c=>PL[c.id]||(PL[c.id]={placed:[],order:shuf(c.play.tiles.length,c.id),msg:null});
function plGood(c,n){const p=c.play,s=plSt(c);if(s.placed.length<n)return false;for(let i=0;i<n;i++)if(p.tiles[s.placed[i]]!==p.tiles[p.answer[i]])return false;return true}

function readRows(){return Object.entries(S.read||{}).filter(([id,L])=>BYID[id]&&L.length).map(([id,L])=>{const c=BYID[id],wc=wordCount(c),best=Math.min(...L.map(r=>r.sec));return{name:deckName(c.sheet),first:L[0].sec,last:L[L.length-1].sec,best,n:L.length,wpm:Math.round(wc/L[L.length-1].sec*60)}})}
function readStatHTML(){const R=readRows();return `<section class="panel stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h2>읽기 속도</h2><span class="muted small">수능 목표 1분에 100단어 안팎</span></div>${R.length?`<div class="rrec">${R.map(r=>`<div><span>${esc(r.name)}</span><b class="num">${mmss(r.last)}</b><span class="num">${r.wpm}단어/분</span>${r.n>1&&r.first>r.last?`<em>−${r.first-r.last}초</em>`:""}</div>`).join("")}</div>`:`<span class="muted small">읽기 카드 3단계에서 시간을 재면 지문마다 기록이 쌓여요.</span>`}</section>`}
/* ===== 리포트 ===== */
const MARK_A="===== 백업 데이터 시작 (복원용, 수정하지 마세요) =====",MARK_B="===== 백업 데이터 끝 =====";
function buildReport(photos){
  const r=rankOf(S.xp),ws=whyStat(),L=["[영어 1등급 노트 · 학습 리포트]","학생: "+(S.studentName||"-"),"생성일: "+today(),""];
  L.push("■ 요약",`- ${r.g}등급 / ${S.xp} XP · 공부한 날 ${S.studied.length}일 · 연속 ${streak()}일`,`- 문제 정답 ${S.log.filter(l=>l.ok).length} · 오답 ${S.log.filter(l=>!l.ok).length} · 평균 풀이 ${avgSec()}초`,`- 틀린 이유(사진 포함): ${WHY.map(([k,n])=>n+" "+ws.c[k]).join(" · ")} · 미선택 ${ws.c.n}`,`- 단어: 본 단어 ${Object.keys(S.words).length} · 오늘 복습 대기 ${dueWords().length} · 몰라요 기록 ${Object.values(S.words).filter(w=>w.miss).length}`,`- 지금 진도: ${deckName(S.curN)} · 수능 D-${dday(SUNEUNG)}`+(S.exam.date?` · ${S.exam.name} D-${dday(S.exam.date)}`:""),"");
  L.push("■ 덱별 진행 (완료/전체 · 정답률)");SHEETS.forEach(s=>{if(!ready(s))return;const done=s.cards.filter(isDone).length;if(!done)return;const lg=S.log.filter(l=>l.sheet===s.no);L.push(`- ${deckName(s.no)} ${s.title}: ${done}/${s.cards.length}`+(lg.length?` · ${lg.filter(l=>l.ok).length}/${lg.length}`:""))});
  const RR=readRows();if(RR.length){L.push("■ 지문 읽기 시간 (처음 → 최근 · 최고)");RR.forEach(r=>L.push(`- ${r.name}: ${mmss(r.first)} → ${mmss(r.last)} · 최고 ${mmss(r.best)} · ${r.wpm}단어/분 · ${r.n}회`))}
  L.push("","■ 최근 오답 (최근 20개)");const wr=S.log.filter(l=>!l.ok).slice(-20);wr.forEach(l=>L.push(`- ${l.d} ${l.src}${l.why?" ("+WHYN[l.why]+")":""}${l.pick!==undefined?" · 고른 답 "+N5[l.pick]:""}`));if(!wr.length)L.push("- 없음");
  const mw=Object.entries(S.words).filter(([id,w])=>w.miss&&BYID[id]).slice(-20);if(mw.length){L.push("","■ 몰라요 누른 단어");mw.forEach(([id,w])=>L.push(`- ${BYID[id].en} (${w.miss}회)`))}
  L.push("",...PhotoNote.reportLines(photos));
  L.push("",MARK_A,JSON.stringify(S),MARK_B);return L.join("\n");
}
async function doShare(){
  const ph=PhotoNote.unsent();reportText=buildReport(ph);
  const files=[new File([reportText],`영어리포트_${today().replace(/-/g,"").slice(2)}.txt`,{type:"text/plain"})].concat(PhotoNote.files(ph));
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:"영어 리포트"});await PhotoNote.markSent(ph);S.lastExport=today();save();reportText="";render();toast(ph.length?`리포트와 사진 ${ph.length}장을 보냈어요`:"리포트를 보냈어요");return}}
  catch(e){if(e&&e.name==="AbortError")return}
  render();toast("이 화면에서는 공유 창이 열리지 않아요. 홈 화면 앱에서 다시 눌러 주세요. 글은 아래에서 복사할 수 있어요");
}
async function doCopy(){reportText=buildReport([]);try{await navigator.clipboard.writeText(reportText);S.lastExport=today();save();render();toast("복사했어요. 채팅에 붙여 넣어 주세요")}catch(e){render();toast("아래 글을 길게 눌러 복사해 주세요")}}
function doRestore(){const t=($("#restoreIn")||{}).value||"";const a=t.indexOf(MARK_A),b=t.indexOf(MARK_B);
  try{const j=JSON.parse(a>=0&&b>a?t.slice(a+MARK_A.length,b).trim():t.trim());if(!j||j.v!==1)throw 0;S=Object.assign(blank(),j);window.SET=S;save();restoreOpen=false;for(const k in UI)delete UI[k];render();toast("기록을 복원했어요")}
  catch(e){toast("백업 데이터를 찾지 못했어요. 리포트 글 전체를 붙여 넣어 주세요")}}

   <div class="helpnav">${HELP.map(([k,t])=>`<button data-guidego="${k}" class="${k===focus?"on":""}">${t.replace(/ \(.*\)/,"")}</button>`).join("")}</div></div>
   ${HELP.map(([k,t,items])=>`<section class="helpsec ${k===focus?"on":""}" id="help-${k}"><h3>${t}</h3><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></section>`).join("")}

  if(d.speak){if(speakingId===d.speak){stopSpeak();return}speakCard(BYID[d.speak],d.speak);return}
  if(d.explain){const u=ui(d.explain);u.ex=!u.ex;if(u.ex&&S.tts==="auto")speakCard(BYID[d.explain]);redrawCard(d.explain);return}
  if(d.ttstoggle!==undefined){if(S.tts==="off"){S.tts=S.ttsLast||"tap";toast("읽어 주기를 켰어요. 듣기 버튼을 눌러 보세요")}else{S.ttsLast=S.tts;S.tts="off";stopSpeak();toast("읽어 주기를 껐어요")}save();render();return}
  if(d.ttsmode){S.tts=d.ttsmode;if(S.tts!=="off")S.ttsLast=S.tts;else stopSpeak();save();render();if(S.tts!=="off")speakMixed("읽어 주기 테스트예요. This is how English sounds.");return}
  if(d.ttsrate){S.ttsRate=+d.ttsrate;save();render();speakMixed("이 속도로 읽어 줄게요. Let’s read together.");return}
  if(d.blank){const[id,j]=d.blank.split(":"),c=BYID[id],u=ui(id);u.open.add(+j);if(u.open.size===blanksOf(c)){const s=cs(id);if(!s.done){s.done=1;markStudied();addXP(8,t);confetti(60);save()}}redrawCard(id);return}
  if(d.openall){const c=BYID[d.openall],u=ui(c.id);for(let j=0;j<blanksOf(c);j++)u.open.add(j);const s=cs(c.id);if(!s.done){s.done=1;markStudied();save()}redrawCard(c.id);return}
  if(d.help){const c=BYID[d.help];if(!c)return;const u=ui(c.id);
    if(u.pick===undefined&&u.h<(c.hints||[]).length)u.h++;else{toast(u.pick!==undefined?"답을 골랐으니 아래 근거 문장을 봐요":"힌트를 다 봤어요");return}
    redrawCard(c.id);return}
  if(d.hint){ui(d.hint).h++;redrawCard(d.hint);return}
  if(d.opt){const[id,k]=d.opt.split(":"),c=BYID[id],u=ui(id);if(u.pick!==undefined)return;u.pick=+k;u.line=null;record(c,u.pick===c.ansIdx,t,{pick:u.pick});redrawCard(id);return}
  if(d.evid){const u=ui(d.evid);u.ev=!u.ev;redrawCard(d.evid);if(u.ev)requestAnimationFrame(()=>{const m=document.querySelector(`.slide[data-id="${CSS.escape(d.evid)}"] mark.evm`);if(m)m.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"})});return}
  if(d.kotr){const u=ui(d.kotr);u.ko=!u.ko;redrawCard(d.kotr);return}
  if(d.how){const u=ui(d.how);u.how=!u.how;redrawCard(d.how);return}
  if(d.rstep){const[id,k]=d.rstep.split(":"),c=BYID[id],u=rui(c);stopSpeak();u.st=+k;u.si=0;if(u.st<3)u.tg=Object.assign({},RDEF[u.st]);u.res=0;if(RT&&RT.id===id)RT=null;redrawCard(id);return}
  if(d.rtg){const[id,k]=d.rtg.split(":"),u=rui(BYID[id]);u.tg[k]=u.tg[k]?0:1;if(k==="jk"&&u.st===2)u.nt=1;redrawCard(id);return}
  if(d.rgo){const[id,k]=d.rgo.split(":"),c=BYID[id],u=rui(c);stopSpeak();const n=u.si+(+k);
    if(n>=c.sents.length){if(u.st===1){u.st=2;u.tg=Object.assign({},RDEF[2]);toast("1단계 끝! 이번엔 혼자 끊어 읽어 봐요")}else{u.st=3;toast("2단계 끝! 이제 시간을 재고 처음부터 읽어요")}u.si=0;markStudied();addXP(5,t);save()}
    else{u.si=Math.max(0,n);if(u.st===2)u.tg=Object.assign({},RDEF[2],{sl:u.tg.sl});u.nt=0}
    redrawCard(id);if(S.tts==="auto"&&u.st===1&&n<c.sents.length)setTimeout(()=>speakSent(c,u.si,id),300);return}
  if(d.rstart){RT={id:d.rstart,start:Date.now()};const u=rui(BYID[d.rstart]);u.res=0;redrawCard(d.rstart);return}
  if(d.rstop){if(!RT)return;const id=d.rstop,sec=Math.round((Date.now()-RT.start)/1000),u=rui(BYID[id]);if(sec<20){toast("20초도 안 됐어요. 끝까지 읽고 눌러 주세요");return}RT=null;
    const L=S.read[id]||(S.read[id]=[]);const first=!L.some(r=>r.d===today());L.push({d:today(),sec});if(L.length>30)L.shift();u.res=sec;u.showP=1;markStudied();if(first)addXP(10,t);confetti(80);save();redrawCard(id);return}
  if(d.gap){const[id,i]=d.gap.split(":"),s=ckSt(BYID[id]);s.cut.has(+i)?s.cut.delete(+i):s.cut.add(+i);s.chk=false;redrawCard(id);return}
  if(d.gapreset){const s=ckSt(BYID[d.gapreset]);s.cut=new Set();s.chk=false;redrawCard(d.gapreset);return}
  if(d.gapcheck){const c=BYID[d.gapcheck],p=c.play,s=ckSt(c);s.chk=true;const need=new Set(p.need),ok=new Set(p.ok||[]);
    if(p.need.every(g=>s.cut.has(g))&&[...s.cut].every(g=>need.has(g)||ok.has(g))){const st=cs(c.id);if(!st.playXP){st.playXP=1;st.done=1;markStudied();addXP(10,t);save()}confetti(120)}
    redrawCard(c.id);return}
  if(d.flip){const u=ui(d.flip);u.flip=!u.flip;if(!u.flip)delete u.graded;redrawCard(d.flip);return}
  if(d.wk){const[id,k]=d.wk.split(":"),u=ui(id),w=S.words[id]||(S.words[id]={st:0,due:today()});
    if(k==="k"){w.st=Math.min(WGAP.length,w.st+1);w.due=addDays(today(),WGAP[w.st-1]);addXP(4,t)}else{w.st=0;w.due=addDays(today(),1);w.miss=(w.miss||0)+1;addXP(2,t)}
    w.last=today();u.graded=k;markStudied();save();redrawCard(id);return}
  if(d.pladd){const[id,i]=d.pladd.split(":"),c=BYID[id],s=plSt(c);if(!s.placed.includes(+i))s.placed.push(+i);
    if(s.placed.length===c.play.tiles.length&&plGood(c,c.play.tiles.length)){const st=cs(id);if(!st.playXP){st.playXP=1;st.done=1;markStudied();addXP(10,t);save()}confetti(120)}
    redrawCard(id);return}
  if(d.plrm){const[id,i]=d.plrm.split(":"),s=plSt(BYID[id]);s.placed.splice(+i,1);redrawCard(id);return}

  if(d.retry){const u=ui(d.retry);delete u.pick;delete u.mark;delete u.ev;delete u.ko;u.chk=new Set();u.h=0;u.line=null;seenAt[d.retry]=Date.now();redrawCard(d.retry);return}
  if(d.why){const[id,k]=d.why.split(":"),s=cs(id);s.why=k;const l=[...S.log].reverse().find(x=>x.id===id&&!x.ok);if(l)l.why=k;save();redrawCard(id);toast("기록했어요. 프로필에서 비율로 볼 수 있어요");return}
  if(d.top!==undefined){const f=$("#feed");if(f)f.scrollTo({top:0,behavior:reduce?"auto":"smooth"});return}
  if(d.soon!==undefined){toast("기말고사 뒤에 열어 둘게요");return}

  if(d.exam!==undefined){S.exam.name=($("#exName").value||"").trim().slice(0,20)||"시험";S.exam.date=$("#exDate").value||"";save();toast("시험 일정을 저장했어요");render();return}
  if(d.share!==undefined){doShare();return}

  if(d.restore){if(d.restore==="open")restoreOpen=true;else if(d.restore==="no")restoreOpen=false;else return doRestore();render();return}
  if(d.reset){if(d.reset==="ask")confirmReset=true;else if(d.reset==="no")confirmReset=false;else{const keep={studentName:S.studentName,charName:S.charName,_skipName:S._skipName};S=Object.assign(blank(),keep);window.SET=S;for(const k in UI)delete UI[k];reportText="";save();confirmReset=false;toast("기록을 지웠어요")}render();return}

/* ===== 잠금 모듈 (수학 1등급 노트에서 검증) =====
   필요: 데이터 표시 두 곳(가이드 2-1 참고). 이 주석에는 표시 문자열을 그대로 쓰지 않는다(암호화 스크립트가 오인함).
   앱의 시작 코드는 startApp() 함수 안으로 옮긴다. 이 모듈이 DATA를 채운 뒤 startApp()을 부른다. */
const LOCK={APP_KEY:"english-note-key",SHARED_KEY:"shlee-note-key",IMG:WAVE,HELLO:"안녕! 처음 한 번만 비밀번호를 알려 줘. 그다음부터는 바로 열려."};
(function(){
  const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
  async function keyFromPw(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
  async function openWith(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(ENC.iv)},key,b64d(ENC.ct));return (new Function("return ("+new TextDecoder().decode(pt)+")"))()}
  async function savedKey(){try{const r=localStorage.getItem(LOCK.APP_KEY)||localStorage.getItem(LOCK.SHARED_KEY);if(!r)return null;return await crypto.subtle.importKey("raw",b64d(r),{name:"AES-GCM"},true,["decrypt"])}catch(e){return null}}
  function show(msg,bad){
    let el=document.getElementById("lockScreen");
    if(!el){el=document.createElement("div");el.id="lockScreen";document.body.appendChild(el)}
    el.innerHTML=`<div class="lk-card">${LOCK.IMG?`<img class="lk-img" src="${LOCK.IMG}" alt="">`:""}<div class="lk-bubble">${msg||LOCK.HELLO}</div>
      <form id="lkForm"><label for="lkPw">비밀번호</label><input id="lkPw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required class="${bad?"bad":""}"><button id="lkBtn">열기</button></form>
      <p class="lk-note">비밀번호는 보호자에게 받아요.</p></div>`;
    setTimeout(()=>{const i=document.getElementById("lkPw");if(i)i.focus()},100);
  }
  function done(d){DATA=d;const el=document.getElementById("lockScreen");if(el)el.remove();startApp()}
  document.addEventListener("submit",async e=>{if(e.target.id!=="lkForm")return;e.preventDefault();
    const pw=document.getElementById("lkPw").value,btn=document.getElementById("lkBtn");btn.disabled=true;btn.textContent="여는 중…";
    try{const key=await keyFromPw(pw);const d=await openWith(key);
      try{const raw=b64e(await crypto.subtle.exportKey("raw",key));localStorage.setItem(LOCK.APP_KEY,raw);localStorage.setItem(LOCK.SHARED_KEY,raw)}catch(_){}
      done(d)}
    catch(err){await new Promise(r=>setTimeout(r,600));show("음… 비밀번호가 달라요. 다시 한 번 확인해 줄래?",true)}});
  window.addEventListener("DOMContentLoaded",async()=>{
    if(!window.crypto||!crypto.subtle){show("이 브라우저에서는 열 수 없어요. 아이폰 Safari로 열어 주세요.");return}
    const k=await savedKey();
    if(k){try{return done(await openWith(k))}catch(e){try{localStorage.removeItem(LOCK.APP_KEY)}catch(_){}}show("비밀번호가 바뀌었어. 새 비밀번호를 한 번만 알려 줘.");return}
    show();
  });
})();
